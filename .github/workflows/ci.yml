name: Test inspection
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python inspection.py generate --data data/synthetic --seed 42
      - run: python inspection.py train --data data/synthetic --model output/model.npz
      - run: python inspection.py evaluate --data data/synthetic --model output/model.npz --output output/evaluation
